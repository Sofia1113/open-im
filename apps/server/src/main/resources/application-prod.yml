server:
  address: ${HOST:0.0.0.0}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # 生产环境必须显式提供，不保留本地默认值
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: 5

  flyway:
    # 生产不加载任何演示种子数据
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

openim:
  demo-login-enabled: false
  client-origin: ${CLIENT_ORIGIN}

  jwt:
    active-key-id: ${JWT_ACTIVE_KEY_ID:k1}
    keys:
      # 轮换步骤：
      #   1. 注入环境变量 OPENIM_JWT_KEYS_K2=<新密钥>（此时它只用于验证）
      #   2. 把 JWT_ACTIVE_KEY_ID 切到 k2，新令牌开始用新密钥签发
      #   3. 等待至少一个刷新令牌 TTL 后移除 k1
      # 这里不预置 k2，避免为占位一个空槽位而强行给它一个默认值。
      k1: ${TOKEN_SECRET}
