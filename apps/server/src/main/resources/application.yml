server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:3001}

spring:
  application:
    name: open-im-server
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/openim}
    username: ${DATABASE_USER:openim}
    password: ${DATABASE_PASSWORD:openim}
    hikari:
      pool-name: openim-pool
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 1200000

  flyway:
    enabled: true
    # 演示种子数据只在本地/开发环境加载；prod profile 覆盖为仅 db/migration
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

openim:
  token-secret: ${TOKEN_SECRET:open-im-local-demo-secret-do-not-use-in-production}
  demo-login-enabled: ${DEMO_LOGIN_ENABLED:true}
  client-origin: ${CLIENT_ORIGIN:http://localhost:5173}
