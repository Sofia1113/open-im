# OpenIM 服务端部署清单
#
# 前置：
#   kubectl create secret generic openim-secrets \
#     --from-literal=token-secret='<至少 32 字符的随机密钥>' \
#     --from-literal=database-password='<数据库密码>'
#
# 多副本：在线状态、限流配额、事件扇出和事件去重都已通过 Redis 共享，
# 会话事件路由按数据库成员关系实时解析。已用两个实例实测：跨实例投递恰好一次、
# 在线状态互相可见、限流配额共享（第 11 次请求被拒而非各自 10 次）、
# 同账号多设备跨实例各收一条、单实例停机后另一实例继续服务。
#
# 仍在 JVM 内存中的状态：WebSocket **连接注册表**（sessionId → 连接对象）。
# 这不阻碍多副本——Redis subscriber 在每个实例上都会收到事件，各自投递给本地连接——
# 但要求同一条 WebSocket 连接的生命周期内始终落在同一个 Pod 上。
# HTTP 请求无状态，无需粘性。因此 Ingress 需要为 /ws 配置会话亲和，见文件末尾说明。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: openim-server
  labels:
    app: openim-server
spec:
  # 2 副本是"能容忍单 Pod 故障"的最小值，也是 PodDisruptionBudget
  # minAvailable: 1 开始真正生效的前提。
  replicas: 2
  selector:
    matchLabels:
      app: openim-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: openim-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "3001"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: openim-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/openim
            - name: DATABASE_USER
              value: openim
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openim-secrets
                  key: database-password
            - name: TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: openim-secrets
                  key: token-secret
            - name: CLIENT_ORIGIN
              value: https://im.example.com
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openim-secrets
                  key: redis-url
            # 注入 Pod 名称作为实例 ID，便于 Pub/Sub 消息追踪与日志关联
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # 存活探针只反映进程是否卡死。它不包含数据库检查——
          # 否则数据库短暂抖动会引发容器被反复重启，把一次可恢复的故障放大成雪崩。
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3

          # 就绪探针包含数据库：依赖不可用时摘除流量，但保留进程
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          # 启动探针给足冷启动时间（Flyway 迁移 + 连接池预热），
          # 使 livenessProbe 的阈值不必为了迁就启动而放宽
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # 不设 CPU 上限：CPU 节流会让 GC 和请求处理一起变慢，
              # 内存才是需要硬限制的资源
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      # 只读根文件系统下 JVM 仍需要可写的临时目录
      volumes:
        - name: tmp
          emptyDir: {}

      # 优雅停机：配合 server.shutdown=graceful，让在途请求和 WebSocket 连接有时间收尾
      terminationGracePeriodSeconds: 45

      # 把副本打散到不同节点。单节点集群下用 preferred 而非 required，
      # 否则第二个 Pod 会永远 Pending——宁可两副本同节点，也不要只有一个副本可用。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: openim-server

---
apiVersion: v1
kind: Service
metadata:
  name: openim-server
  labels:
    app: openim-server
spec:
  type: ClusterIP
  selector:
    app: openim-server
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openim-server
spec:
  # replicas=2 下该预算允许一次自愿驱逐（节点排空、滚动更新），
  # 同时保证始终有一个副本在服务。replicas=1 时它只会阻止一切驱逐。
  minAvailable: 1
  selector:
    matchLabels:
      app: openim-server

---
# Ingress：WebSocket 需要会话亲和，HTTP 不需要
#
# 连接注册表在 JVM 内存中，因此一条 WebSocket 连接必须始终落在同一个 Pod。
# 这里用 nginx ingress 的 cookie 亲和；换用其他 Ingress Controller 时
# 对应配置分别是：Traefik 的 sticky sessions、AWS ALB 的 target group stickiness、
# GCE 的 BackendConfig sessionAffinity。
#
# 注意：亲和只影响**新连接**落到哪个 Pod。已建立的连接由 TCP 自身维持，
# 不受后续路由决策影响；Pod 重启时连接断开，客户端按既有退避逻辑重连。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openim-server
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "openim-route"
    # 亲和只对 /ws 有意义，但 nginx 的 annotation 作用于整个 Ingress。
    # HTTP 请求带上这个 cookie 无害——它们本身无状态，落到哪个 Pod 都一样。
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    # WebSocket 长连接：默认 60s 读超时会在空闲时切断连接。
    # 应用层心跳间隔为 30s，这里留出足够余量。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: im.example.com # 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openim-server
                port:
                  number: 80
  tls:
    - hosts:
        - im.example.com
      secretName: openim-tls
