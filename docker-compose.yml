# 本地开发与整体验证
#
#   docker compose up -d                             仅启动 postgres + redis
#   docker compose --profile full up -d --build      连同服务端一起以容器方式运行
#   docker compose down -v                           停止并清空所有数据
#
# 宿主机直接运行服务端时：
#   PostgreSQL：jdbc:postgresql://127.0.0.1:5432/openim
#   Redis：redis://127.0.0.1:6379

services:
  postgres:
    image: postgres:17-alpine
    container_name: openim-postgres
    environment:
      POSTGRES_DB: openim
      POSTGRES_USER: openim
      POSTGRES_PASSWORD: openim
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openim -d openim"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openim-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    profiles: ["full"]
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: openim-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: jdbc:postgresql://postgres:5432/openim
      DATABASE_USER: openim
      DATABASE_PASSWORD: openim
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      # 本地编排使用的占位密钥；生产必须由密钥管理系统注入
      TOKEN_SECRET: local-compose-secret-with-more-than-32-characters
      TZ: UTC
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
