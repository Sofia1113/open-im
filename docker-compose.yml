# 本地开发依赖
#
# 启动：docker compose up -d
# 停止并清空数据：docker compose down -v
#
# 服务端默认连接 jdbc:postgresql://127.0.0.1:5432/openim（见 application.yml）。

services:
  postgres:
    image: postgres:17-alpine
    container_name: openim-postgres
    environment:
      POSTGRES_DB: openim
      POSTGRES_USER: openim
      POSTGRES_PASSWORD: openim
      # 使用 UTC，与应用层 timestamptz 语义一致
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openim -d openim"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
